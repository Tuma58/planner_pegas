<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PegasLogistic · диспетчерская</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5' fill='%2316324a'/%3E%3Cpath fill='%237fd6c0' d='M3 14c3.5-1 6-3 8-7 .4 3 .1 5-1 7 2 .3 4-.2 6-2-.5 2.4-2 4.2-4.3 5.2 1.3 1 3 1.4 5.3 1.1-2.6 1.9-5.6 2.4-8.6 1.3C6.2 18.9 4.3 16.9 3 14z'/%3E%3Ccircle cx='16.5' cy='7.5' r='.9' fill='%2316324a'/%3E%3C/svg%3E">
<style>
  :root{
    --navy:#16324a; --navy2:#1f425f; --teal:#2e7d6b; --ink:#16222e;
    --paper:#eaeff4; --card:#ffffff; --line:#d5dde5; --muted:#68788a; --soft:#f4f7fa;
    --z-dom:#2e7d6b; --z-msk:#3b6ea5; --z-sam:#c77f3b; --z-chr:#6f8f43; --z-pit:#5f7fa8;
    --z-zol:#9c5c8c; --z-vos:#b1483e; --z-ural:#6f66a8; --z-yug:#c99a3a; --z-zap:#4a9a97;
    --ok:#2e7d6b; --warn:#c98a2a; --bad:#b1483e; --plan:#7f8fa6;
    --shadow:0 1px 3px rgba(20,40,60,.10),0 1px 2px rgba(20,40,60,.06);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    font-family:ui-sans-serif,system-ui,"Segoe UI",Roboto,Arial,sans-serif;
    background:var(--paper); color:var(--ink);
    font-variant-numeric:tabular-nums; font-size:13px; line-height:1.4;
  }
  .mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
  .app{display:flex;flex-direction:column;height:100vh}

  /* ── Top rail ── */
  .rail{background:var(--navy);color:#fff;display:flex;align-items:center;gap:18px;padding:0 16px;height:52px;flex:none}
  .brand{display:flex;align-items:center;gap:9px}
  .brand .mark{display:flex;align-items:center;color:#7fd6c0}
  .brand b{font-size:15px;letter-spacing:.04em;font-weight:800}
  .brand b::first-letter{color:#7fd6c0}
  .brand .tagline{font-size:11px;color:#9fb4c6;letter-spacing:.03em;align-self:flex-end;padding-bottom:2px}
  .roles{display:flex;gap:2px;margin-left:8px}
  .role{border:0;background:transparent;color:#b9c9d6;padding:7px 13px;border-radius:7px 7px 0 0;
    font-size:12px;font-weight:600;cursor:pointer;letter-spacing:.02em;position:relative;top:2px}
  .role:hover{color:#fff;background:rgba(255,255,255,.06)}
  .role.on{background:var(--paper);color:var(--navy)}
  .rail .right{margin-left:auto;display:flex;align-items:center;gap:14px}
  .presence{display:flex;align-items:center;gap:6px}
  .dot{width:8px;height:8px;border-radius:50%;background:#57d08a;box-shadow:0 0 0 3px rgba(87,208,138,.2)}
  .who{font-size:11px;color:#9fb4c6}
  .chip-on{display:inline-flex;align-items:center;gap:5px;background:rgba(255,255,255,.1);
    padding:3px 9px;border-radius:20px;font-size:11px}
  .sync{font-size:11px;color:#8fb;opacity:.85;display:flex;align-items:center;gap:5px}

  /* ── Toolbar ── */
  .tools{background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:center;
    gap:14px;padding:8px 16px;flex:none;flex-wrap:wrap}
  .seg{display:flex;gap:0;border:1px solid var(--line);border-radius:8px;overflow:hidden}
  .seg button{border:0;background:#fff;padding:6px 11px;font-size:12px;cursor:pointer;color:var(--muted);font-weight:600}
  .seg button.on{background:var(--navy);color:#fff}
  .horizon{font-weight:700;color:var(--navy);font-size:13px}
  .legend{display:flex;gap:10px;margin-left:auto;flex-wrap:wrap}
  .lg{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--muted)}
  .sw{width:11px;height:11px;border-radius:3px}

  /* ── Layout ── */
  .body{flex:1;display:flex;min-height:0}
  .board{flex:1;overflow:auto;position:relative}
  .panel{width:340px;flex:none;background:var(--card);border-left:1px solid var(--line);
    overflow:auto;padding:14px}

  /* ── Calendar grid ── */
  .cal{position:relative;min-width:max-content}
  .calhead{display:flex;position:sticky;top:0;z-index:6;background:var(--soft);border-bottom:1px solid var(--line)}
  .fixhead{width:230px;flex:none;position:sticky;left:0;z-index:7;background:var(--soft);
    border-right:1px solid var(--line);display:flex;align-items:center;padding:0 12px;font-size:11px;
    text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700;height:44px}
  .day{width:var(--cw);flex:none;text-align:center;border-right:1px solid var(--line);padding:5px 0;height:44px}
  .day .dn{font-weight:700;font-size:13px;color:var(--navy)}
  .day .dm{font-size:10px;color:var(--muted);text-transform:uppercase}
  .day.we{background:#e4ebf1}
  .row{display:flex;border-bottom:1px solid var(--line);position:relative;height:46px}
  .row:hover{background:#f7fafc}
  .fixcell{width:230px;flex:none;position:sticky;left:0;z-index:5;background:var(--card);
    border-right:1px solid var(--line);display:flex;align-items:center;gap:8px;padding:0 12px}
  .row:hover .fixcell{background:#f7fafc}
  .tbadge{width:6px;height:30px;border-radius:3px;flex:none}
  .tinfo{min-width:0}
  .tplate{font-weight:700;font-size:12.5px;letter-spacing:.02em}
  .tmeta{font-size:10.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:150px}
  .track{position:relative;flex:1;height:46px}
  .grid-bg{position:absolute;inset:0;display:flex;pointer-events:none}
  .gcell{width:var(--cw);flex:none;border-right:1px solid #eef2f6}
  .gcell.we{background:#f2f6f9}
  .leg{position:absolute;top:7px;height:32px;border-radius:6px;color:#fff;padding:3px 7px;
    font-size:10.5px;overflow:hidden;cursor:pointer;box-shadow:var(--shadow);border:1px solid rgba(0,0,0,.08);
    display:flex;flex-direction:column;justify-content:center;transition:transform .06s}
  .leg:hover{transform:translateY(-1px);filter:brightness(1.05);z-index:3}
  .leg b{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.15}
  .leg .sub{opacity:.9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:9.5px}
  .leg.done{opacity:.62}
  .leg.rej{background-image:repeating-linear-gradient(45deg,rgba(0,0,0,.18),rgba(0,0,0,.18) 5px,transparent 5px,transparent 10px)!important;outline:2px solid #b1483e;outline-offset:-2px}
  .leg.rej b{text-decoration:line-through;text-decoration-color:rgba(255,255,255,.7)}
  .leg.conflict{outline:2px solid #e0533c;outline-offset:-2px;box-shadow:0 0 0 3px rgba(224,83,60,.28);z-index:3;animation:cfpulse 1.6s ease-in-out infinite}
  @keyframes cfpulse{0%,100%{box-shadow:0 0 0 3px rgba(224,83,60,.28)}50%{box-shadow:0 0 0 5px rgba(224,83,60,.14)}}
  .leg .cflag{position:absolute;top:-7px;left:-5px;background:#e0533c;color:#fff;font-size:9px;font-weight:700;border-radius:8px;padding:0 3px;line-height:14px;z-index:4}
  .conflict-chip{background:#e0533c;color:#fff;font-size:12px;font-weight:700;padding:6px 11px;border-radius:8px;white-space:nowrap}
  .rowconflict{color:#e0533c;font-weight:800;margin-left:5px;cursor:help}
  .cfbanner{background:#fdecea;border:1px solid #f3b8b0;color:#a5342a;border-radius:8px;padding:9px 11px;font-size:12.5px;font-weight:600;margin:10px 0}
  .sughint{font-size:11px;color:var(--muted);margin:8px 0 5px;font-weight:600}
  .sugtruck{display:flex;align-items:center;gap:8px;padding:6px 9px;border:1px solid var(--line);border-radius:8px;margin-bottom:5px;font-size:12px;cursor:pointer;background:#fff}
  .sugtruck:hover{border-color:var(--teal);background:#f3faf7}
  .sugtruck.sel{border-color:var(--teal);background:#eaf7f1;box-shadow:0 0 0 1px var(--teal)}
  .sugtag{font-size:11px;font-weight:700}
  .toolbtn{border:1px solid var(--line);background:#fff;color:var(--navy);padding:6px 12px;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer}
  .toolbtn:hover{background:var(--soft);border-color:var(--teal)}
  .sheetmask{position:fixed;inset:0;background:rgba(16,34,50,.55);display:none;align-items:center;justify-content:center;z-index:80;padding:24px}
  .sheetmask.on{display:flex}
  .sheet{background:#fff;border-radius:14px;width:min(1000px,96vw);height:min(80vh,820px);display:flex;flex-direction:column;overflow:hidden;box-shadow:0 24px 70px rgba(0,0,0,.35)}
  .sheet-head{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);flex:none;flex-wrap:wrap}
  .sheet-head h2{margin:0;font-size:14px;color:var(--navy);text-transform:uppercase;letter-spacing:.04em}
  .sheet-head input,.sheet-head select{padding:7px 10px;border:1px solid var(--line);border-radius:8px;font-size:13px}
  .sheet-head input{min-width:200px;flex:1}
  .sheet-count{font-size:11px;color:var(--muted);font-weight:600;white-space:nowrap}
  .sheet-head #cl_close{margin-left:auto;border:1px solid var(--line);background:#fff;border-radius:8px;width:34px;height:34px;cursor:pointer;font-weight:700;color:var(--muted)}
  .sheet-head #cl_close:hover{background:#fdeeee;color:var(--bad);border-color:#e6b3b0}
  .sheet-body{flex:1;overflow:auto}
  .ctable{width:100%;border-collapse:collapse;font-size:12.5px}
  .ctable th{position:sticky;top:0;background:var(--soft);text-align:left;padding:9px 12px;font-size:11px;
    text-transform:uppercase;letter-spacing:.03em;color:var(--muted);border-bottom:1px solid var(--line);z-index:1}
  .ctable th.num,.ctable td.num{text-align:right}
  .ctable td{padding:7px 12px;border-bottom:1px solid #eef2f6}
  .ctable tr:hover td{background:#f7fafc}
  .zchip{color:#fff;font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:10px;white-space:nowrap}
  .leg .st{position:absolute;top:3px;right:4px;width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.9)}
  .now{position:absolute;top:0;bottom:0;width:0;border-left:2px dashed #3355aa;z-index:4}
  .now::before{content:"сегодня";position:absolute;top:-1px;left:3px;font-size:9px;color:#fff;font-weight:700;background:#3355aa;padding:1px 4px;border-radius:0 0 4px 0}
  .empty-hint{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    color:#b7c3cd;font-size:11px;pointer-events:none}

  /* ── Panel bits ── */
  .ph{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--navy);font-weight:700;
    margin:2px 0 10px;display:flex;align-items:center;gap:8px}
  .ph .tag{font-size:10px;background:var(--soft);color:var(--muted);padding:2px 7px;border-radius:10px;letter-spacing:0;text-transform:none}
  label.f{display:block;font-size:11px;color:var(--muted);margin:9px 0 3px;font-weight:600}
  select,input{width:100%;padding:7px 9px;border:1px solid var(--line);border-radius:7px;font-size:13px;
    font-family:inherit;background:#fff;color:var(--ink)}
  input:focus,select:focus{outline:2px solid #9fc3e0;outline-offset:-1px;border-color:#9fc3e0}
  .btn{width:100%;border:0;background:var(--teal);color:#fff;padding:9px;border-radius:8px;font-weight:700;
    font-size:13px;cursor:pointer;margin-top:12px;letter-spacing:.02em}
  .btn:hover{filter:brightness(1.06)}
  .btn.alt{background:var(--navy)}
  .btn.ghost{background:#fff;color:var(--navy);border:1px solid var(--line)}
  .calc{background:var(--soft);border:1px solid var(--line);border-radius:9px;padding:10px;margin-top:12px}
  .calc .r{display:flex;justify-content:space-between;font-size:12px;padding:2px 0}
  .calc .r b{font-weight:700}
  .calc .big{font-size:17px;color:var(--navy);font-weight:800}
  .calc .neg{color:var(--bad)}
  .kpi{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
  .kc{background:var(--soft);border:1px solid var(--line);border-radius:9px;padding:9px 10px}
  .kc .l{font-size:10.5px;color:var(--muted);font-weight:600}
  .kc .v{font-size:16px;font-weight:800;color:var(--navy);margin-top:2px}
  .kc.good .v{color:var(--teal)}
  .kc.bad .v{color:var(--bad)}
  .list{margin-top:6px}
  .li{display:flex;align-items:center;gap:8px;padding:7px 8px;border:1px solid var(--line);
    border-radius:8px;margin-bottom:6px;font-size:12px;background:#fff}
  .li .pl{font-weight:700}
  .li .mi{color:var(--muted);font-size:11px}
  .li .rt{margin-left:auto;font-weight:700}
  .badge{font-size:10px;padding:2px 7px;border-radius:10px;font-weight:700;color:#fff}
  .b-plan{background:#7f8fa6}.b-run{background:#3b6ea5}.b-unl{background:#c98a2a}
  .b-done{background:#2e7d6b}.b-pay{background:#20624f}.b-rej{background:#b1483e}
  .hint{font-size:11px;color:var(--muted);margin-top:10px;line-height:1.5}
  .orders .li{cursor:pointer}
  .orders .li:hover{border-color:var(--teal);background:#f3faf7}

  /* ── Modal ── */
  .mask{position:fixed;inset:0;background:rgba(16,34,50,.5);display:none;align-items:center;justify-content:center;z-index:50}
  .mask.on{display:flex}
  .modal{background:#fff;border-radius:12px;width:400px;max-width:92vw;padding:18px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
  .modal h3{margin:0 0 4px;color:var(--navy);font-size:15px}
  .modal .msub{color:var(--muted);font-size:12px;margin-bottom:8px}
  .modal .row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .modal .actions{display:flex;gap:8px;margin-top:14px}
  .status-pick{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .sp{border:1px solid var(--line);border-radius:20px;padding:5px 11px;font-size:12px;cursor:pointer;background:#fff;font-weight:600}
  .sp.on{color:#fff;border-color:transparent}
  .toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;
    padding:9px 16px;border-radius:9px;font-size:12px;opacity:0;transition:opacity .25s;z-index:60;box-shadow:var(--shadow)}
  .toast.on{opacity:1}
  @media (max-width:860px){.panel{display:none}}
  /* Состав ТС */
  .fhead{display:flex;align-items:center;gap:12px;padding:12px 16px;position:sticky;top:0;
    background:var(--card);border-bottom:1px solid var(--line);z-index:3}
  .fhead h2{margin:0;font-size:14px;color:var(--navy);text-transform:uppercase;letter-spacing:.05em}
  .ftag{font-size:11px;background:var(--soft);color:var(--muted);padding:3px 10px;border-radius:12px;font-weight:600}
  .addbtn{margin-left:auto;border:0;background:var(--teal);color:#fff;padding:8px 14px;border-radius:8px;font-weight:700;cursor:pointer}
  .addbtn:hover{filter:brightness(1.06)}
  .ftable{width:100%;border-collapse:collapse;font-size:12.5px;background:#fff}
  .ftable th{position:sticky;top:53px;background:var(--soft);text-align:left;padding:8px 10px;font-size:11px;
    text-transform:uppercase;letter-spacing:.04em;color:var(--muted);border-bottom:1px solid var(--line);z-index:2}
  .ftable td{padding:4px 8px;border-bottom:1px solid var(--line)}
  .ftable tr:hover td{background:#f7fafc}
  .ftable input,.ftable select{padding:5px 7px;border:1px solid transparent;background:transparent;border-radius:6px;
    font-size:12.5px;font-family:inherit;color:var(--ink);width:auto}
  .ftable input:hover,.ftable select:hover{border-color:var(--line);background:#fff}
  .ftable input:focus,.ftable select:focus{border-color:#9fc3e0;background:#fff;outline:none}
  select.st-work{color:var(--teal);font-weight:700}
  select.st-rep{color:var(--warn);font-weight:700}
  select.st-out{color:var(--muted)}
  select.st-nodrv{color:#b06a2a;font-weight:700}
  .li.ord{cursor:pointer}
  .li.ord:hover{border-color:var(--teal);background:#f3faf7}
  .li.ord.sel{border-color:var(--teal);background:#eaf7f1;box-shadow:0 0 0 1px var(--teal)}
  .xbtn{border:1px solid var(--line);background:#fff;color:var(--bad);border-radius:6px;padding:3px 9px;cursor:pointer;font-weight:700}
  .xbtn:hover{background:#fdeeee;border-color:#e6b3b0}
  .match-card{border:1px solid var(--line);border-radius:9px;padding:9px 10px;margin-bottom:7px;background:#fff}
  .match-card.repos{background:#fbfaf4;border-style:dashed}
  .match-card .top{display:flex;align-items:center;gap:8px;font-size:12px}
  .match-card .free{font-size:11px;color:var(--muted);margin-top:3px}
  .statelbl{font-weight:700;font-size:12px}
  .rsn{font-size:9.5px;color:var(--muted);margin-left:5px;background:var(--soft);padding:1px 6px;border-radius:8px}
  .cum{margin-left:10px;color:var(--navy);font-weight:700}
  .rt.neg{color:var(--bad)}
  /* Отчёт руководителя */
  .cascade{display:flex;align-items:center;gap:0;flex-wrap:wrap;padding:16px}
  .cbox{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px 15px;min-width:128px;text-align:center;box-shadow:var(--shadow)}
  .cbox .cn{font-size:22px;font-weight:800;color:var(--navy);line-height:1}
  .cbox .cl{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;margin-top:4px}
  .carrow{display:flex;flex-direction:column;justify-content:center;align-items:center;padding:0 12px;min-width:118px}
  .carrow .cf{font-size:10px;color:var(--muted)}
  .carrow .ck{font-size:14px;font-weight:800;color:var(--muted)}
  .carrow .ct{font-size:9.5px;color:var(--muted)}
  .carrow.ok .ck{color:var(--teal)} .carrow.warn .ck{color:var(--warn)} .carrow.bad .ck{color:var(--bad)}
  .rgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:0 16px}
  .rcard{background:#fff;border:1px solid var(--line);border-radius:11px;padding:14px}
  .rcard h3{margin:0 0 10px;font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--navy)}
  .rtable{width:100%;border-collapse:collapse;font-size:12.5px}
  .rtable th{text-align:left;font-size:10.5px;text-transform:uppercase;color:var(--muted);padding:4px 6px;border-bottom:1px solid var(--line)}
  .rtable td{padding:6px}
  .rtable td.num,.rtable th.num{text-align:right}
  .rtable td.muted{color:var(--muted);font-size:11px}
  .rtable tr.tot td{font-weight:800;border-top:2px solid var(--navy)}
  .dotc{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:7px;vertical-align:middle}
  .mdrow{display:flex;justify-content:space-between;padding:7px 2px;border-bottom:1px solid #eef2f6;font-size:12.5px}
  .mdrow b{font-weight:700}.mdrow .neg{color:var(--bad)}
  .mdrow.big{font-size:14px;border-bottom:0;margin-top:4px}.mdrow.big b{font-size:16px}
  @media (max-width:760px){.rgrid{grid-template-columns:1fr}}
  .row.dim{opacity:.5}
  .rowstate{font-weight:700}
  .leg .hres{position:absolute;top:0;bottom:0;width:8px;cursor:col-resize;z-index:2}
  .leg .hres.l{left:0;border-radius:6px 0 0 6px}
  .leg .hres.r{right:0;border-radius:0 6px 6px 0}
  .leg .hres:hover{background:rgba(255,255,255,.35)}
  .leg.dragging{z-index:9;box-shadow:0 6px 18px rgba(0,0,0,.28);filter:brightness(1.04);user-select:none}
  .draglabel{position:fixed;background:var(--navy);color:#fff;padding:5px 9px;border-radius:7px;
    font-size:11px;z-index:70;pointer-events:none;white-space:nowrap;box-shadow:0 4px 12px rgba(0,0,0,.25)}
  .datehint{font-size:11px;color:var(--muted);margin-top:6px;background:var(--soft);padding:5px 8px;border-radius:6px}
  .datehint b{color:var(--navy)}
  .splash{position:fixed;inset:0;z-index:100;background:radial-gradient(circle at 50% 40%,#1f425f,#16324a 70%);
    display:flex;align-items:center;justify-content:center;transition:opacity .5s ease}
  .splash.hide{opacity:0;pointer-events:none}
  .splash-inner{text-align:center;color:#fff;animation:splashUp .6s ease}
  @keyframes splashUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

/* конфликты: наложение рейсов по времени на одной сцепке (кроме отклонённых) */
function computeConflicts(){
  const set=new Set(), byTruck={};
  plan.forEach(l=>{ if(l.status==='rej')return; (byTruck[l.truck]=byTruck[l.truck]||[]).push(l); });
  Object.values(byTruck).forEach(legs=>{
    for(let i=0;i<legs.length;i++) for(let j=i+1;j<legs.length;j++){
      const A=legs[i],B=legs[j];
      if(A.start < B.start+B.days-1e-6 && B.start < A.start+A.days-1e-6){ set.add(A.id); set.add(B.id); }
    }
  });
  return set;
}
function plur(n,forms){ const a=Math.abs(n)%100,b=a%10;
  return forms[(a>10&&a<20)?2:(b===1?0:(b>=2&&b<=4?1:2))]; }
function localStorage_role(){ return "logist"; } // роль по умолчанию (localStorage запрещён в артефактах)

function genSeed(){
  const legs=[]; const L0=MONTHS[0].len;
  TRUCKS.forEach((tr,ti)=>{
    const tmpl=TEMPL[tr.t]; let day=(ti%3)*0.7; let k=0;
    while(day<L0){
      const [a,b]=tmpl[k%tmpl.length]; const dist=km(a,b); const du=transit(dist);
      if(day+du>L0+0.5) break;
      legs.push({id:"L"+ti+"_"+k, truck:tr.p, from:a, to:b, start:+day.toFixed(2), days:du,
        km:dist, rev:rev(a,b), client:CLIENTS_BY[a+"|"+b]||"", status:(day<3?"done":(day<5?"run":"plan")) });
      day+=du+0.15; k++;
    }
  });
  return legs;
}
async function loadAll(seedIfEmpty){
  let p=await store.get(PLAN_KEY);
  if(p==null && seedIfEmpty){ plan=genSeed(); await store.set(PLAN_KEY, JSON.stringify(plan)); }
  else { try{plan=JSON.parse(p||"[]")}catch(e){plan=[]} }
  let o=await store.get(ORD_KEY);
  try{orders=JSON.parse(o||"[]")}catch(e){orders=[]}
  let fl=await store.get(FLEET_KEY);
  if(fl==null && seedIfEmpty){ fleet=TRUCKS.map(t=>({...t})); await store.set(FLEET_KEY,JSON.stringify(fleet)); }
  else { try{fleet=JSON.parse(fl||"[]")}catch(e){fleet=[]} }
  if(!fleet.length) fleet=TRUCKS.map(t=>({...t}));
  lastPlanJSON=JSON.stringify(plan); lastOrdJSON=JSON.stringify(orders); lastFleetJSON=JSON.stringify(fleet);
}
async function saveFleet(){ lastFleetJSON=JSON.stringify(fleet); await store.set(FLEET_KEY,lastFleetJSON); pingSync(); }

/* presence */
async function heartbeat(){
  await store.set("presence_"+me, JSON.stringify({role:me,t:Date.now()}));
  const keys=await store.list("presence_");
  const now=Date.now(); let live=new Set();
  for(const k of keys){ try{ const v=JSON.parse(await store.get(k)); if(now-v.t<25000) live.add(v.role);}catch(e){} }
  live.add(me);
  const names=[...live].map(r=>(ROLES.find(x=>x.id===r)||{}).name||r);
  document.getElementById("who").textContent = live.size+" в сети · "+names.join(", ");
}
/* live-sync polling */
async function poll(){
  const p=await store.get(PLAN_KEY), o=await store.get(ORD_KEY), fl=await store.get(FLEET_KEY);
  let changed=false;
  if(p!=null && p!==lastPlanJSON){ try{plan=JSON.parse(p);lastPlanJSON=p;changed=true}catch(e){} }
  if(o!=null && o!==lastOrdJSON){ try{orders=JSON.parse(o);lastOrdJSON=o;changed=true}catch(e){} }
  if(fl!=null && fl!==lastFleetJSON){ try{fleet=JSON.parse(fl);lastFleetJSON=fl;changed=true}catch(e){} }
  if(changed){ render(); flash("обновлено коллегой"); }
}

      const sub=l.status==='rej'?('✕ '+(l.reason||'отклонён')):`${l.client||''} · ${fmtRub(prof)}`;

        style="left:${left}px;width:${w}px;background:${ZC[l.to]}" title="${cf?'⚠ Конфликт: наложение по времени · ':''}${l.from}→${l.to}">
        ${cf?'<span class="cflag">⚠</span>':''}<span class="st"></span>
        <b>${l.from}→${l.to}</b>
        <span class="sub">${sub}</span></div>`;
    }).join("");
    const stt=truckState(tr);
    if(stt.k==='rep'||stt.k==='nodrv'){
      const from=tr.offFrom!=null?tr.offFrom:viewFrom, to=tr.offTo!=null?tr.offTo:viewTo;
      const [vs,ve]=clip(from,to);
      if(ve>vs){
        const left=(vs-viewFrom)*CW, w=Math.max((ve-vs)*CW-3,44);
        const per=tr.offFrom!=null?`${dstrShort(from)} – ${dstrShort(to)}`:'весь период';
        blocks+=`<div class="offbar ${stt.k}" style="left:${left}px;width:${w}px" title="${stt.label} · ${per}">
          <b>${stt.label} · ${stt.reason}</b><span class="offsub">${per}</span></div>`;
      }
    } else if(legs.length===0){ blocks+=`<div class="empty-hint">нет плана</div>`; }
    const plegs=legs.filter(l=>l.start<viewTo && (l.start+l.days)>viewFrom);
    const cur=plegs.reduce((s,l)=>s+(l.rev/(1+NDS)-l.km*COST),0);
    const cd=plegs.reduce((s,l)=>s+l.days,0);
    const proj=cd>0?(cur/cd)*pLen():0;
    const rowCf=legs.some(l=>curConflicts.has(l.id));
    return `<div class="row">
      <div class="fixcell">
        <span class="tbadge" style="background:${typeColor(tr.t)}"></span>
        <div class="tinfo"><div class="tplate mono">${tr.p}${rowCf?'<span class="rowconflict" title="Конфликт расписания">⚠</span>':''}</div>
          <div class="tmeta"><span class="rowstate" style="color:${stt.color}">${stt.label}</span>${stt.reason!=='—'?` · ${stt.reason}`:` · ${tr.d||'—'}`}</div></div>
      </div>
      <div class="track" data-truck="${tr.p}">${bg}${blocks}</div>
      <div class="profcell">
        <div class="pcur ${cur<0?'neg':''}">${fmtRub(cur)}</div>
        <div class="pproj ${proj<0?'neg':''}">${fmtRub(proj)}</div>
      </div>
    </div>`;
  }).join("");
  const nd=nowOffsetDays();
  const nowHtml=(nd>=viewFrom&&nd<viewTo)?`<div class="now" style="left:${230+(nd-viewFrom)*CW}px"></div>`:"";
  cal.innerHTML=head+rows+nowHtml;

  // клики / перетаскивание по плечам
  if(me==="logist"){
    enableDrag();
    cal.querySelectorAll(".track").forEach(tr=>tr.ondblclick=(e)=>{
      if(e.target.closest(".leg"))return;
      const rect=tr.getBoundingClientRect(); const x=e.clientX-rect.left;
      const day=Math.max(pStart(),Math.min(pEnd()-0.5, viewFrom+Math.round(x/CW*2)/2));
      openAddLeg(tr.dataset.truck, day);
    });
  } else {
    cal.querySelectorAll(".leg").forEach(el=>el.onclick=()=>openLeg(el.dataset.leg));
  }
}
/* перетаскивание и растягивание плеча по календарю (роль логист) */
function dstrShort(d){ const dt=new Date(START); dt.setDate(dt.getDate()+Math.floor(d));
  return dt.toLocaleDateString("ru-RU",{day:'2-digit',month:'short'})+' '+String(Math.round((d%1)*24)).padStart(2,'0')+':00'; }
function showDragLabel(x,y,s,e,extra){ let el=document.getElementById("draglabel");
  if(!el){ el=document.createElement("div"); el.id="draglabel"; el.className="draglabel"; document.body.appendChild(el); }
  el.style.left=(x+12)+"px"; el.style.top=(y-30)+"px";
  el.innerHTML=`${dstrShort(s)} → ${dstrShort(e)} · <b>${(e-s).toFixed(1)} сут</b>${extra?`<span style="color:#ffd27a">${extra}</span>`:''}`; el.style.display="block"; }
function hideDragLabel(){ const el=document.getElementById("draglabel"); if(el) el.style.display="none"; }
function trackTruckAt(clientX, clientY){
  const tracks=document.querySelectorAll(".track");
  for(const tr of tracks){ const r=tr.getBoundingClientRect();
    if(clientY>=r.top && clientY<=r.bottom) return tr.dataset.truck; }
  return null;
}
function enableDrag(){
  document.querySelectorAll(".leg").forEach(el=>{
    el.insertAdjacentHTML("beforeend",'<span class="hres l"></span><span class="hres r"></span>');
    el.style.cursor="grab";
    let mode=null,startX=0,startY=0,orig=null,leg=null,moved=false,tgtTruck=null;
    el.onpointerdown=(e)=>{
      leg=plan.find(x=>x.id===el.dataset.leg); if(!leg)return;
      if(e.target.classList.contains("hres")) mode=e.target.classList.contains("l")?"l":"r";
      else mode="move";
      startX=e.clientX; startY=e.clientY; orig={start:leg.start,days:leg.days}; moved=false; tgtTruck=null;
      el.setPointerCapture(e.pointerId); el.classList.add("dragging"); el.style.cursor="grabbing";
      e.preventDefault(); e.stopPropagation();
    };
    el.onpointermove=(e)=>{
      if(mode===null)return;
      if(Math.abs(e.clientX-startX)>3||Math.abs(e.clientY-startY)>3) moved=true;
      const dd=Math.round(((e.clientX-startX)/CW)*2)/2;
      let s=orig.start,d=orig.days;
      if(mode==="move") s=Math.min(Math.max(pStart(),orig.start+dd),pEnd()-orig.days);
      else if(mode==="r") d=Math.min(Math.max(0.5,orig.days+dd),pEnd()-orig.start);
      else { const ns=Math.min(Math.max(pStart(),orig.start+dd),orig.start+orig.days-0.5); d=+(orig.days+(orig.start-ns)).toFixed(2); s=ns; }
      el.style.left=((s-viewFrom)*CW)+"px"; el.style.width=Math.max(d*CW-3,20)+"px";
      el.dataset._s=s; el.dataset._d=d;
      // вертикальный перенос: подсветка целевой машины
      let extra="";
      if(mode==="move"){ el.style.pointerEvents="none"; tgtTruck=trackTruckAt(e.clientX,e.clientY); el.style.pointerEvents="";
        if(tgtTruck && tgtTruck!==leg.truck) extra=" → "+tgtTruck; }
      showDragLabel(e.clientX,e.clientY,s,s+d,extra);
    };
    el.onpointerup=async(e)=>{
      if(mode===null)return; const wasMove=(mode==="move"); mode=null;
      el.releasePointerCapture(e.pointerId); el.classList.remove("dragging"); el.style.cursor="grab"; hideDragLabel();
      if(!moved){ openLeg(leg.id); return; }
      const s=+el.dataset._s,d=+el.dataset._d;
      let msg="сроки рейса обновлены";
      if(wasMove && tgtTruck && tgtTruck!==leg.truck){ leg.truck=tgtTruck; msg="рейс перенесён на "+tgtTruck; }
      if(!isNaN(s)&&!isNaN(d)){ leg.start=+s.toFixed(2); leg.days=+d.toFixed(2); }
      await savePlan(); render();
      if(curConflicts.has(leg.id)) flash("⚠ конфликт: наложение по времени на этой сцепке");
      else flash(msg);
    };
  });
}
function typeColor(t){ return {"Тушевоз":"#3b6ea5","Паллет 33":"#6f8f43","Паллет 41":"#c77f3b","Допельшток":"#9c5c8c"}[t]||"#68788a"; }

/* — Отдел продаж — */
function suggestReturn(zone){
  const lanes=LANES[zone];
  if(lanes && lanes.length){ const best=lanes[0]; return {to:best.to, client:best.client, rev:best.rev}; }
  const to=zone==="Дом"?"Москва":"Дом";
  return {to, client:"", rev:Math.round(rev(zone,to))};
}
function autoRequests(){
  const reqs=[];
  fleet.filter(f=>(f.status||'work')==='work').forEach(f=>{
    const legs=plan.filter(l=>l.truck===f.p).sort((a,b)=>(a.start+a.days)-(b.start+b.days));
    if(!legs.length) return;
    const last=legs[legs.length-1], endDay=last.start+last.days;
    if(endDay < pEnd()-0.3){
      const sug=suggestReturn(last.to);
      reqs.push({truck:f.p,type:f.t,zone:last.to,day:endDay,winTo:Math.min(endDay+2,pEnd()),
        sugTo:sug.to,sugClient:sug.client,sugRev:sug.rev});
    }
  });
  return reqs.sort((a,b)=>a.day-b.day);
}

/* где и когда сцепка освобождается */
function freeInfo(plate){
  const f=fleet.find(x=>x.p===plate)||{};
  const legs=plan.filter(l=>l.truck===plate).sort((a,b)=>(a.start+a.days)-(b.start+b.days));
  if(legs.length===0) return {zone:f.zone||"Дом", day:0};
  const last=legs[legs.length-1];
  return {zone:last.to, day:+(last.start+last.days).toFixed(2)};
}
/* подбор сцепок под груз: зона отправления + желаемая дата (день от эпохи) */
function matchTrucks(zone, byDay, type){
  const act=fleet.filter(f=>(f.status||'work')==='work' && (!type||type==='all'||f.t===type));
  const rows=act.map(f=>({f, ...freeInfo(f.p)}));
  const here=rows.filter(r=>r.zone===zone && r.day<=byDay+1).sort((a,b)=>a.day-b.day)
    .map(r=>({...r,repos:false,dist:0}));
  const elsewhere=rows.filter(r=>!(r.zone===zone && r.day<=byDay+1))
    .map(r=>({...r,repos:true,dist:km(r.zone,zone)})).sort((a,b)=>a.dist-b.dist||a.day-b.day);
  return here.concat(elsewhere).slice(0,5);
}

function runMatch(){
  const Z=document.getElementById("m_zone").value, byDay=+document.getElementById("m_day").value,
    ty=document.getElementById("m_type").value;
  const act=fleet.filter(f=>(f.status||'work')==='work' && (ty==='all'||f.t===ty));
  const rows=act.map(f=>({f, ...freeInfo(f.p)}));
  const here=rows.filter(r=>r.zone===Z && r.day<=byDay).sort((a,b)=>a.day-b.day);
  const elsewhere=rows.filter(r=>!(r.zone===Z && r.day<=byDay))
    .map(r=>({...r,dist:km(r.zone,Z)})).sort((a,b)=>a.dist-b.dist||a.day-b.day).slice(0,6);
  const dstr=(d)=>{const dt=new Date(START);dt.setDate(dt.getDate()+Math.floor(d));
    return dt.toLocaleDateString("ru-RU",{day:"2-digit",month:"short"})+" "+String(Math.round((d%1)*24)).padStart(2,"0")+":00";};
  const card=(r,repos)=>`<div class="match-card ${repos?'repos':''}">
     <div class="top"><span class="mono" style="font-weight:700">${r.f.p}</span>
       <span class="badge" style="background:${typeColor(r.f.t)}">${r.f.t}</span>
       ${repos?`<span style="margin-left:auto;color:var(--warn);font-weight:700">перегон ${r.dist} км</span>`
              :`<span style="margin-left:auto;color:var(--teal);font-weight:700">в зоне</span>`}</div>
     <div class="free">${r.f.d||'без водителя'} · ${r.f.trailer||''} · свободна в «${r.zone}» с ${dstr(r.day)}</div></div>`;
  let html=`<div class="ph" style="margin:2px 0 6px">В зоне «${Z}» <span class="tag">${here.length}</span></div>`;
  html+= here.length? here.map(r=>card(r,false)).join("") : `<div class="hint">Нет свободных в этой зоне к сроку.</div>`;
  html+=`<div class="ph" style="margin:12px 0 6px">С перегоном <span class="tag">${elsewhere.length}</span></div>`+elsewhere.map(r=>card(r,true)).join("");
  document.getElementById("m_res").innerHTML=html;
}

/* состояние сцепки по каскаду КТГ/КВЛ/КИП */
function truckState(f){
  const st=f.status||'work';
  if(st==='out') return {k:'out',label:'Выведен',reason:'—',dept:'—',color:'#9aa7b3'};
  if(st==='rep') return {k:'rep',label:'В ремонте',reason:'КТГ',dept:'ТОиР',color:'var(--warn)'};
  if(st==='nodrv' || !f.d || !String(f.d).trim()) return {k:'nodrv',label:'Без водителя',reason:'КВЛ',dept:'Упр. водителями',color:'#b06a2a'};
  const has=plan.some(l=>l.truck===f.p);
  if(!has) return {k:'noord',label:'Без заказа',reason:'КИП',dept:'Логистика',color:'#8a6ea8'};
  return {k:'work',label:'В работе',reason:'—',dept:'—',color:'var(--teal)'};
}
/* каскад использования парка + машино-дни + упущенная прибыль */
function utilization(){
  const list=fleet.filter(f=>(f.status||'work')!=='out'); const N=list.length, H=pLen(), P0=pStart(), P1=pEnd();
  let rep=0,nod=0,noo=0,work=0, md={work:0,rep:0,nod:0,noo:0};
  list.forEach(f=>{
    const s=truckState(f);
    if(s.k==='rep'){rep++;md.rep+=H;return;}
    if(s.k==='nodrv'){nod++;md.nod+=H;return;}
    if(s.k==='noord'){noo++;md.noo+=H;return;}
    work++;
    const legs=plan.filter(l=>l.truck===f.p);
    for(let d=P0;d<P1;d++){ const c=legs.some(l=>(d+0.5)>l.start&&(d+0.5)<(l.start+l.days));
      if(c) md.work++; else md.noo++; }
  });
  const tech=N-rep, line=tech-nod, inwork=line-noo;
  const ktg=N?tech/N:0, kvl=tech?line/tech:0, kip=line?inwork/line:0, overall=N?inwork/N:0;
  const perLegs=plan.filter(l=>l.start<P1 && (l.start+l.days)>P0);
  const pd=perLegs.reduce((s,l)=>s+l.days,0), pf=perLegs.reduce((s,l)=>s+(l.rev/(1+NDS)-l.km*COST),0);
  const perDay=pd?pf/pd:0, cal=N*H, norm=cal*0.951, fact=md.work, lost=Math.max(0,(norm-fact))*perDay;
  return {N,H,rep,nod,noo,work,tech,line,inwork,ktg,kvl,kip,overall,md,perDay,cal,norm,fact,lost};
}

    });
  }
}

    <div class="calc">
      <div class="r"><span>Пробег</span><b>${l.km.toLocaleString('ru-RU')} км</b></div>

      <div class="r"><span>Выручка б.НДС</span><b>${fmtRub(net)}</b></div>
      <div class="r"><span>Прибыль</span><b class="${prof<0?'neg':''} big">${fmtRub(prof)}</b></div>

    ${canStatus?`<label class="f">Статус рейса</label><div class="status-pick">${picks}</div>`:''}

    ${me==="logist"?`<label class="f">Даты рейса — начало → завершение</label>
      <div class="row2"><input id="e_start" type="date" value="${isoFromDay(l.start)}" min="${ISOMIN}" max="${ISOMAX}">
      <input id="e_end" type="date" value="${isoFromDay(l.start+l.days)}" min="${ISOMIN}" max="${ISOMAX}"></div>
      <div id="e_dates" class="datehint"></div>`:''}
    <div class="actions">
      ${me==="logist"?`<button class="btn ghost" id="delLeg">Удалить рейс</button>`:''}
      <button class="btn" id="closeM">Готово</button>
    </div>`;
  showMask(true);
  const rsel=document.getElementById("l_reason");
  if(rsel) rsel.onchange=async()=>{ l.reason=rsel.value; await savePlan(); };
  if(me==="logist"){
    const es=document.getElementById("e_start"), ee=document.getElementById("e_end"), ed=document.getElementById("e_dates");
    const showDates=()=>{ let s=dayFromISO(es.value), e=dayFromISO(ee.value); if(e<=s)e=s+1;
      if(ed) ed.innerHTML=`${dstrShort(s)} → ${dstrShort(e)} · <b>${(e-s).toFixed(1)} сут</b>`; };
    if(es&&ee){ const applyTime=async()=>{ let s=dayFromISO(es.value), e=dayFromISO(ee.value);
      if(e<=s) e=s+1; l.start=s; l.days=e-s; await savePlan(); render(); };
      es.onchange=()=>{showDates();applyTime();}; ee.onchange=()=>{showDates();applyTime();}; showDates(); }
  }
  m.querySelectorAll(".sp").forEach(sp=>sp.onclick=async()=>{ l.status=sp.dataset.s; await savePlan(); render(); openLeg(id); });
  const del=document.getElementById("delLeg");
  if(del) del.onclick=async()=>{ plan=plan.filter(x=>x.id!==id); await savePlan(); render(); showMask(false); flash("рейс удалён"); };
  document.getElementById("closeM").onclick=()=>showMask(false);
}
function openAddLeg(truck, startDay){
  const opts=ZONES.map(z=>`<option>${z}</option>`).join("");
  const m=document.getElementById("modal");
  m.innerHTML=`<h3>Новый рейс</h3><div class="msub mono">${truck} · старт день ${startDay}</div>
    <div class="row2"><div><label class="f">Откуда</label><select id="a_from">${opts}</select></div>
    <div><label class="f">Куда</label><select id="a_to">${opts}</select></div></div>
    <label class="f">Заказчик</label><input id="a_client">
    <label class="f">Выручка с НДС, ₽ (пусто = авто)</label><input id="a_rev" type="number">
    <div class="calc" id="a_calc"></div>
    <div class="actions"><button class="btn ghost" id="a_cancel">Отмена</button>
    <button class="btn" id="a_ok">Добавить</button></div>`;
  showMask(true);
  const fa=document.getElementById("a_from"), ta=document.getElementById("a_to"); ta.selectedIndex=1;
  const rv=document.getElementById("a_rev"), calc=document.getElementById("a_calc");
  const upd=()=>{ const k=km(fa.value,ta.value); const r=rv.value?+rv.value:rev(fa.value,ta.value);
    const prof=r/(1+NDS)-k*COST;
    calc.innerHTML=`<div class="r"><span>Пробег</span><b>${k} км</b></div><div class="r"><span>Прибыль</span><b class="${prof<0?'neg':''}">${fmtRub(prof)}</b></div>`; };
  fa.onchange=upd;ta.onchange=upd;rv.oninput=upd;upd();
  document.getElementById("a_cancel").onclick=()=>showMask(false);
  document.getElementById("a_ok").onclick=async()=>{
    const k=km(fa.value,ta.value);
    plan.push({id:"L"+Date.now(),truck,from:fa.value,to:ta.value,start:startDay,days:transit(k),km:k,
      rev:rv.value?+rv.value:rev(fa.value,ta.value),client:document.getElementById("a_client").value||"",status:"plan"});
    await savePlan(); render(); showMask(false); flash("рейс добавлен");
  };
}
function showMask(on){ document.getElementById("mask").classList.toggle("on",on); }
document.getElementById("mask").onclick=(e)=>{ if(e.target.id==="mask") showMask(false); };

/* ============ ПРОЧЕЕ ============ */
let toastT;
function flash(msg){ const t=document.getElementById("toast"); t.textContent=msg; t.classList.add("on");
  clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove("on"),1800); }
document.getElementById("roles").onclick=(e)=>{ const b=e.target.closest(".role"); if(!b)return;
  me=b.dataset.r; render(); heartbeat(); };
document.getElementById("typeFilter").onclick=(e)=>{ const b=e.target.closest("button"); if(!b)return;
  filterType=b.dataset.t; document.querySelectorAll("#typeFilter button").forEach(x=>x.classList.toggle("on",x===b)); renderCal(); };
(function initClientsSheet(){
  const overlay=document.getElementById("clientsSheet"), tbody=document.getElementById("cl_tbody");
  const search=document.getElementById("cl_search"), selF=document.getElementById("cl_from"),
    selT=document.getElementById("cl_to"), count=document.getElementById("cl_count");
  selF.innerHTML=`<option value="">откуда: все</option>`+ZONES.map(z=>`<option>${z}</option>`).join("");
  selT.innerHTML=`<option value="">куда: все</option>`+ZONES.map(z=>`<option>${z}</option>`).join("");
  function draw(){
    const q=(search.value||"").toLowerCase().trim(), zf=selF.value, zt=selT.value;
    const rows=CLIENTS_FULL.filter(c=>(!q||c[0].toLowerCase().includes(q))&&(!zf||c[1]===zf)&&(!zt||c[2]===zt));
    count.textContent=rows.length+" из "+CLIENTS_FULL.length;
    tbody.innerHTML=rows.map(c=>`<tr>
      <td>${c[0]}</td>
      <td><span class="zchip" style="background:${ZC[c[1]]||'#889'}">${c[1]}</span></td>
      <td><span class="zchip" style="background:${ZC[c[2]]||'#889'}">${c[2]}</span></td>
      <td class="num">${c[3]}</td>
      <td class="num">${(c[4]).toLocaleString('ru-RU')} ₽</td>
      <td class="num">${c[5]}</td></tr>`).join("")
      || `<tr><td colspan="6" style="text-align:center;color:var(--muted);padding:20px">Ничего не найдено</td></tr>`;
  }
  search.oninput=draw; selF.onchange=draw; selT.onchange=draw;
  document.getElementById("openClients").onclick=()=>{ draw(); overlay.classList.add("on"); search.focus(); };
  document.getElementById("cl_close").onclick=()=>overlay.classList.remove("on");
  overlay.onclick=(e)=>{ if(e.target===overlay) overlay.classList.remove("on"); };
})();
(function initDateFilter(){
  const vf=document.getElementById("vf"), vt=document.getElementById("vt");
  vf.min=ISOMIN; vf.max=ISOMAX; vt.min=ISOMIN; vt.max=ISOMAX;
  const apply=()=>{ let f=vf.value?dayFromISO(vf.value):pStart(), t=vt.value?dayFromISO(vt.value)+1:pEnd();
    f=Math.max(0,Math.min(f,TOTAL-1)); t=Math.max(f+1,Math.min(t,TOTAL));
    viewFrom=f; viewTo=t; renderCal(); };
  vf.onchange=apply; vt.onchange=apply;
  document.getElementById("vreset").onclick=()=>{ viewFrom=pStart(); viewTo=pEnd(); vf.value=""; vt.value=""; renderCal(); };
})();
function capfirst(s){ return s.charAt(0).toUpperCase()+s.slice(1); }
function goPeriod(i){ periodIdx=Math.max(0,Math.min(MONTHS.length-1,i));
  viewFrom=pStart(); viewTo=pEnd();
  const vf=document.getElementById("vf"), vt=document.getElementById("vt"); if(vf){vf.value="";vt.value="";}
  const lbl=document.getElementById("periodLabel"); if(lbl) lbl.textContent=capfirst(MONTHS[periodIdx].label);
  render(); }
document.getElementById("pprev").onclick=()=>goPeriod(periodIdx-1);
document.getElementById("pnext").onclick=()=>goPeriod(periodIdx+1);

/* ============ СТАРТ ============ */
(async function(){
  await loadAll(true);
  goPeriod(currentPeriodIdx());
  await heartbeat();
  setInterval(poll, 4000);
  setInterval(heartbeat, 10000);
  const sp=document.getElementById("splash");
  if(sp){ setTimeout(()=>{ sp.classList.add("hide"); setTimeout(()=>sp.remove(),550); }, 1100); }
})();
</script>
