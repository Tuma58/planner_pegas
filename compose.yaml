services:
  planner:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      ADMIN_USERNAME: "${ADMIN_USERNAME:-admin}"
      APP_SECRET_FILE: "/run/secrets/app_secret"
      ADMIN_PASSWORD_FILE: "/run/secrets/admin_password"
      SYNC_WORKER_EMBEDDED: "false"
      COOKIE_SECURE: "${COOKIE_SECURE:-true}"
      INITIAL_ALLOWED_SUBNETS: "${INITIAL_ALLOWED_SUBNETS:-0.0.0.0/0,::/0}"
    secrets:
      - app_secret
      - admin_password
    volumes:
      - ./data:/app/data
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)})"]
      interval: 30s
      timeout: 5s
      retries: 3

  sync-worker:
    build: .
    restart: unless-stopped
    command: ["node", "src/sync-worker.mjs"]
    environment:
      ADMIN_USERNAME: "${ADMIN_USERNAME:-admin}"
      APP_SECRET_FILE: "/run/secrets/app_secret"
      ADMIN_PASSWORD_FILE: "/run/secrets/admin_password"
    secrets:
      - app_secret
      - admin_password
    volumes:
      - ./data:/app/data
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      planner:
        condition: service_healthy

secrets:
  app_secret:
    file: ./.secrets/app_secret
  admin_password:
    file: ./.secrets/admin_password
