<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Настройки · Пегас-Авто · Планер</title>
  <link rel="icon" href="/assets/brand/pegas-symbol.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/styles.css">
  <script>document.documentElement.dataset.theme = localStorage.getItem('pl_theme') || 'light';</script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/planner">
      <span class="brand-plate"><img src="/assets/brand/pegas-logo.svg" alt="Пегас-Авто"></span><span class="brand-word"><b>Пегас-Авто</b><small>Планер · настройки</small></span>
    </a>
    <nav class="topnav"><a href="/planner">Планер</a><a class="active" href="/settings">Настройки</a></nav>
    <div class="profile">
      <button class="theme-toggle" id="themeToggle" title="Переключить тему">◐</button>
      <div class="profile-copy"><strong id="profileName">—</strong><small>Администратор</small></div>
      <span class="avatar" id="avatar">A</span>
      <button class="icon-button" id="logout">Выйти</button>
    </div>
  </header>
  <main class="page settings-layout">
    <nav class="settings-nav" id="settingsNav">
      <button class="active" data-section="general">Планер</button>
      <button data-section="dictionaries">Справочники</button>
      <button data-section="fleet">Состав ТС</button>
      <button data-section="customers">Заказчики</button>
      <button data-section="users">Пользователи</button>
      <button data-section="network">Сеть и доступ</button>
      <button data-section="notifications">Уведомления</button>
      <button data-section="telephony">Телефония и сервисы</button>
      <button data-section="integration">Интеграции</button>
      <button data-section="outbox">Исходящие изменения</button>
    </nav>
    <div class="settings-content" id="settingsContent">
      <div class="empty-state">Загрузка настроек…</div>
    </div>
  </main>
  <div id="modalRoot"></div>
  <script type="module" src="/assets/settings.js"></script>
</body>
</html>
