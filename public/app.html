<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Планер · PegasLogistic</title>
  <link rel="stylesheet" href="/vendor/leaflet.css">
  <link rel="stylesheet" href="/assets/styles.css">
  <script>document.documentElement.dataset.theme = localStorage.getItem('pl_theme') || 'light';</script>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <a class="brand" href="/planner">
        <svg class="brand-mark" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M3 14c3.5-1 6-3 8-7 .4 3 .1 5-1 7 2 .3 4-.2 6-2-.5 2.4-2 4.2-4.3 5.2 1.3 1 3 1.4 5.3 1.1-2.6 1.9-5.6 2.4-8.6 1.3C6.2 18.9 4.3 16.9 3 14z"/></svg>
        PegasLogistic <small>диспетчерская</small>
      </a>
      <nav class="topnav">
        <a class="active" href="/planner">Планер</a>
        <a id="settingsLink" class="hidden" href="/settings">Настройки</a>
      </nav>
      <div class="profile">
        <button class="icon-button call-btn" id="callButton"
          title="Звонок водителя: карточка с ответами на типовые вопросы">📞 Звонок</button>
        <button class="theme-toggle" id="themeToggle" title="Переключить тему">◐</button>
        <div class="profile-copy"><strong id="profileName">—</strong><small id="profileRole">—</small></div>
        <span class="avatar" id="avatar">—</span>
        <button class="icon-button" id="logout" title="Выйти">Выйти</button>
      </div>
    </header>
    <!-- Тулбар зонами (решение руководителя 28.09: «строго, упорядоченно,
         как в мобильных»): 1 — вкладки ролей, 2 — контекст периода (только
         там, где есть канва), 3 — плашки и меню справа. Зоны разделены
         линиями, элементы одной высоты. -->
    <div class="toolbar">
      <div class="tb-zone"><div class="segmented" id="viewTabs"></div></div>
      <div class="tb-zone" id="tbContext">
        <div class="period-nav">
          <button class="button ghost small" id="periodPrev" title="Предыдущий месяц">←</button>
          <strong id="periodLabel">—</strong>
          <button class="button ghost small" id="periodNext" title="Следующий месяц">→</button>
        </div>
        <div class="period-nav" id="scrollNav">
          <button class="button ghost small" id="scrollLeft" title="Прокрутить на неделю назад">‹</button>
          <span class="today-combo" title="Дата отбора: занятость сцепок, фильтры зон и состояний">
            <button class="button ghost small" id="scrollToday">Сегодня</button>
            <input type="date" id="dayPicker" class="day-picker">
          </span>
          <button class="button ghost small" id="scrollRight" title="Прокрутить на неделю вперёд">›</button>
        </div>
        <div class="segmented" id="rangeTabs" title="Обозримый период канвы"></div>
        <div class="segmented" id="typeFilter"></div>
        <div class="legend" id="legend"></div>
      </div>
      <div class="tb-zone toolbar-end">
        <button class="chip-alert hidden" id="exceptionsChip"
          title="Требует решения — реестр проблем, клик откроет список">⚠</button>
        <button class="button ghost small" id="geoButton">🗺 Карта</button>
        <details class="tb-menu" id="refsMenu">
          <summary class="button ghost small">📚 Справочники ▾</summary>
          <div class="tb-menu-list">
            <button class="button ghost small" id="customersButton">Заказчики</button>
            <button class="button ghost small" id="addressesButton">Адреса</button>
          </div>
        </details>
        <span class="sync-state" id="syncState">● подключено</span>
      </div>
    </div>
    <main class="planner-layout">
      <section class="board" aria-label="Календарь рейсов"><div class="timeline" id="timeline"></div></section>
      <aside class="sidepanel" id="sidepanel"></aside>
    </main>
    <footer class="footer"><strong>PegasLogistic</strong><span>· планер холодовой цепи</span></footer>
  </div>
  <div id="modalRoot"></div>
  <script src="/vendor/leaflet.js"></script>
  <script type="module" src="/assets/app.js"></script>
</body>
</html>
