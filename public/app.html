<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Пегас-Авто · Планер</title>
  <link rel="icon" href="/assets/brand/pegas-symbol.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/vendor/leaflet.css">
  <link rel="stylesheet" href="/assets/styles.css">
  <link rel="stylesheet" href="/assets/bi/kit.css">
  <link rel="stylesheet" href="/assets/bi/staff.css">
  <link rel="stylesheet" href="/assets/bi/boss.css">
  <link rel="stylesheet" href="/assets/bi/sales.css">
  <link rel="stylesheet" href="/assets/bi/logistics.css">
  <link rel="stylesheet" href="/assets/bi/dispatch.css">
  <link rel="stylesheet" href="/assets/bi/fleet.css">
  <link rel="stylesheet" href="/assets/bi/service.css">
  <script src="/assets/theme-init.js"></script>
  <link rel="stylesheet" href="/assets/bi/tone.css">
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <a class="brand" href="/planner">
        <span class="brand-plate"><img src="/assets/brand/pegas-logo.svg" alt="Пегас-Авто"></span><span class="brand-word"><b>Пегас-Авто</b><small>Направление СТ · Планер</small></span>
      </a>
      <!-- Каскад структуры СТ: КТГ → КВЛ → КИП → КЭИП; подсвечен
           коэффициент отдела пользователя (заполняет app.js). -->
      <div class="cascade" id="cascadeChips" aria-label="Каскад показателей"></div>
      <nav class="topnav">
        <a id="settingsLink" class="hidden" href="/settings">⚙ Настройки</a>
      </nav>
      <div class="profile">
        <button class="icon-button call-btn" id="callButton"
          title="Звонок водителя: карточка с ответами на типовые вопросы">📞 Звонок</button>
        <button class="theme-toggle" id="themeToggle" title="Переключить тему">◐</button>
        <div class="profile-copy"><strong id="profileName">—</strong><small id="profileRole">—</small></div>
        <span class="avatar" id="avatar">—</span>
        <button class="icon-button" id="changePassword" title="Сменить пароль">🔑</button>
        <button class="icon-button" id="logout" title="Выйти">Выйти</button>
      </div>
    </header>
    <!-- Тулбар зонами (решение руководителя 28.09: «строго, упорядоченно,
         как в мобильных»): 1 — вкладки ролей, 2 — контекст периода (только
         там, где есть канва), 3 — плашки и меню справа. Зоны разделены
         линиями, элементы одной высоты. -->
    <!-- Навигатор (как в «Рабочей среде СТ»): экраны сгруппированы по
         отделам структуры, у группы — её коэффициент каскада. -->
    <aside class="sidenav" id="sideNav">
      <div class="nav-search"><input id="navSearch" type="search" placeholder="Поиск экрана" autocomplete="off"></div>
      <nav id="viewTabs" aria-label="Экраны планера"></nav>
      <button class="nav-collapse" id="navCollapse" type="button" title="Свернуть / развернуть навигатор">«</button>
    </aside>
    <div class="toolbar">
      <div class="tb-zone page-head"><h1 id="pageTitle">—</h1><span id="pageHint"></span></div>
      <div class="tb-zone" id="tbContext">
        <div class="period-nav">
          <button class="button ghost small" id="periodPrev" title="Предыдущий месяц">←</button>
          <strong id="periodLabel">—</strong>
          <button class="button ghost small" id="periodNext" title="Следующий месяц">→</button>
        </div>
        <div class="period-nav" id="scrollNav">
          <button class="button ghost small" id="scrollLeft" title="Прокрутить на неделю назад">‹</button>
          <span class="today-combo" title="Дата отбора: занятость сцепок, фильтры зон и состояний">
            <button class="button ghost small" id="scrollToday">Сегодня</button>
            <input type="date" id="dayPicker" class="day-picker">
          </span>
          <button class="button ghost small" id="scrollRight" title="Прокрутить на неделю вперёд">›</button>
        </div>
        <div class="segmented" id="rangeTabs" title="Обозримый период канвы"></div>
        <div class="segmented" id="typeFilter"></div>
        <div class="legend" id="legend"></div>
      </div>
      <div class="tb-zone toolbar-end">
        <span class="sync-state" id="syncState">● подключено</span>
      </div>
    </div>
    <main class="planner-layout">
      <section class="board" aria-label="Календарь рейсов"><div class="timeline" id="timeline"></div></section>
      <aside class="sidepanel" id="sidepanel"></aside>
    </main>
    <footer class="footer"><strong>Пегас-Авто · Планер</strong><span>· рефрижераторная логистика FTL</span></footer>
  </div>
  <div id="modalRoot"></div>
  <script src="/vendor/leaflet.js"></script>
  <script type="module" src="/assets/app.js"></script>
</body>
</html>
