<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Вход · PegasLogistic</title>
  <link rel="stylesheet" href="/assets/styles.css">
</head>
<body class="login-page">
  <section class="login-visual">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M3 14c3.5-1 6-3 8-7 .4 3 .1 5-1 7 2 .3 4-.2 6-2-.5 2.4-2 4.2-4.3 5.2 1.3 1 3 1.4 5.3 1.1-2.6 1.9-5.6 2.4-8.6 1.3C6.2 18.9 4.3 16.9 3 14z"/><circle cx="16.5" cy="7.5" r="1" fill="#16324a"/></svg>
      PegasLogistic
    </div>
    <div>
      <h1>Все рейсы и ресурсы в одном окне</h1>
      <p>Планирование холодовой цепи, контроль загрузки парка и синхронизация с 1С.</p>
    </div>
    <footer>Диспетчерская · защищенный доступ</footer>
  </section>
  <main class="login-panel">
    <form class="login-card" id="loginForm">
      <h2>Вход в планер</h2>
      <p>Используйте выданную администратором учетную запись.</p>
      <label class="field">Логин
        <input name="username" autocomplete="username" required autofocus>
      </label>
      <label class="field">Пароль
        <input name="password" type="password" autocomplete="current-password" required>
      </label>
      <div class="form-error" id="formError" role="alert"></div>
      <button class="button full" type="submit">Войти</button>
    </form>
  </main>
  <script type="module" src="/assets/login.js"></script>
</body>
</html>
