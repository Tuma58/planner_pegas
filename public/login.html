<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Вход · Пегас-Авто · Планер</title>
  <link rel="icon" href="/assets/brand/pegas-symbol.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/styles.css">
  <script src="/assets/theme-init.js"></script>
</head>
<body class="login-page">
  <section class="login-visual">
    <div class="brand">
      <span class="login-logo"><img src="/assets/brand/pegas-logo.svg" alt="Пегас-Авто"></span>
    </div>
    <div>
      <h1>Под крылом — вся страна, от края до края</h1>
      <p>Пегас-Авто · Планер — рефрижераторная логистика FTL: рейсы, парк и экипажи направления СТ в одном окне.</p>
    </div>
    <footer>Направление СТ · защищённый доступ</footer>
  </section>
  <main class="login-panel">
    <form class="login-card" id="loginForm">
      <h2>Вход в планер</h2>
      <p>Используйте выданную администратором учетную запись.</p>
      <label class="field">Логин
        <input name="username" autocomplete="username" required autofocus>
      </label>
      <label class="field">Пароль
        <input name="password" type="password" autocomplete="current-password" required>
      </label>
      <label class="field">Рабочий телефон
        <input name="workPhone" inputmode="tel" autocomplete="off"
          placeholder="добавочный, мобильный или дежурная трубка">
        <small class="muted">По этому номеру к вам будет всплывать карточка
          входящего звонка. Приняли дежурную трубку — внесите её номер.</small>
      </label>
      <div class="form-error" id="formError" role="alert"></div>
      <button class="button full" type="submit">Войти</button>
    </form>
  </main>
  <script type="module" src="/assets/login.js"></script>
</body>
</html>
